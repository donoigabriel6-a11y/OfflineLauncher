[advisories]
version = 2
# These are unmaintained-crate notices for transitive dependencies.
# No vulnerability advisories are ignored here.
ignore = [
  "RUSTSEC-2025-0119", # number_prefix: no safe upgrade available
  "RUSTSEC-2024-0370", # proc-macro-error: no safe upgrade available
  "RUSTSEC-2026-0370", # zvariant: merged into zbus 6
  "RUSTSEC-2026-0371", # zbus_names: merged into zbus 6
  "RUSTSEC-2026-0372", # zvariant_derive: merged into zbus 6
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "Apache-2.0 WITH LLVM-exception",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
