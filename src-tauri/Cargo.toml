[package]
name = "offline-launcher"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Minecraft Java Edition launcher with offline account support"
authors = ["OfflineLauncher Contributors"]
license = "MIT"
repository = "https://github.com/donoigabriel6-a11y/OfflineLauncher"

[lib]
name = "offline_launcher_lib"
path = "src/lib.rs"

[dependencies]
# Tauri
tauri = { workspace = true, features = [] }
tauri-plugin-shell = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-store = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Async
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Utilities
uuid = { workspace = true }
reqwest = { workspace = true }
sha1 = { workspace = true }
md5 = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
hex = { workspace = true }
shell-words = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
indicatif = { workspace = true }
toml = { workspace = true }
notify = { workspace = true }
walkdir = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"

[features]
# Default features
default = ["custom-protocol"]
# Custom protocol for deep linking
custom-protocol = ["tauri/custom-protocol"]